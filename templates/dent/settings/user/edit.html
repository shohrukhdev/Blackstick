{% extends "home.html" %}
{% load static %}
{% load i18n %}
{% block title %}Add Staff{% endblock %}
{% block content %}
{% get_current_language as LANG_CODE %}
<div class="container">
    <div class="row">
      <div class="col-md-6 col-sm12 mx-auto">
        <div class="card card-success" style="margin-top: 10px">
          <div class="card-header">
            <h3 class="card-title">{% trans 'Edit staff info' %}</h3>
            <div class="card-tools">
              <a type="button" href="{% url 'staff_list' %}?successSave=false" class="btn btn-tool">
                <i class="fas fa-window-close"></i>
              </a>
            </div>
          </div>
          <div class="card-body">
            <form autocomplete="off" id="add_staff" method="post">
              {% csrf_token %}
              <input type="hidden" name="staff_id" value="{{ staff.id }}">
              <div class="form-group">
                <label>{% trans 'First name' %}</label>
                <input type="text" name="first_name" value="{{ staff.user.first_name }}"  class="form-control">
              </div>
              <div class="form-group">
                <label>{% trans 'Last name' %}</label>
                <input type="text" name="last_name" value="{{ staff.user.last_name }}" class="form-control">
              </div>
              <div class="form-group">
                <label>{% trans 'Email' %}</label>
                <input type="email" name="email" value="{{ staff.user.email }}" class="form-control">
              </div>
              <div class="form-group">
                <label>{% trans 'Role' %}</label>
                <select class="form-control" name="role_code">
                  {% for r in roles %}
                  <option value="{{ r.code }}" {% if r.code == staff.role.code %} selected {% endif %}>{{ r.name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="form-group">
                <label>{% trans 'Status' %}</label>
                <select class="form-control" name="status">
                  <option value="1" {% if staff.status == 1 %} selected {% endif %}>{% trans 'Active' %}</option>
                  <option value="0" {% if staff.status == 0 %} selected {% endif %} >{% trans 'Passive' %}</option>
                </select>
              </div>
              <div class="form-group">
                <label>{% trans 'Additional info (address, phone, date of birth, etc)' %}</label>
                <textarea name="additional_info" class="form-control">{{ staff.additional_info }}</textarea>
              </div>
            <button type="submit" class="btn btn-success float-right">{% trans 'Submit' %}</button>
            {% if error_msg %}
              <h6 style="color: red">{{ error_msg }}</h6>
            {% endif %}
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
