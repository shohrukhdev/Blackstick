{% extends "booket/container.html" %}
{% load i18n %}
{% load l10n %}
{% load static %}
{% block title %} Provider {% endblock %}
{% block content %}
<div class="container">
  <div class="row" style="margin-top:25px">
    <div class="col-md-6 col-sm-12">
      <div class="card" style="">
        <img class="card-img-top" src="{{ provider.logo.url }}" alt="Card image">
        <div class="card-body">
          <h4 class="card-title">{{ provider.name }}</h4>
          <p class="card-text">{{ provider.description }}</p>
          <a href="#" class="btn btn-primary">{% trans "Edit" %}</a>
        </div>
      </div>
    </div>
    <div class="col-md-6 col-sm-12">
      <h4>{% trans "Service types:" %}</h4>
      
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      Servers list
    </div>
  </div>
</div>
{% endblock %}
