{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'node_modules/bootstrap/dist/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'node_modules/bootstrap/dist/css/bootstrap-grid.min.css' %}">
  <link rel="stylesheet" href="{% static 'node_modules/bootstrap/dist/css/bootstrap-reboot.min.css' %}">
  <link rel="stylesheet" href="{% static 'node_modules/bootstrap/dist/css/bootstrap-utilities.min.css' %}">
  <link rel="stylesheet" href="{% static 'node_modules/@fortawesome/fontawesome-free/css/all.min.css' %}">
   <!-- One file includes all the Font Awesome Free icons and utilities -->
  <link href="{% static 'fontawesomefree/css/all.min.css' %}" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="{% static 'summernote/summernote-bs5.min.css' %}">
  <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
<style>
  .toast-container {
    z-index: 105000;
  }
</style>

  <!-- Toast container — always present so showToast() can target it -->
  <div class="toast-container position-fixed top-0 end-0 p-3"></div>

  {% block container %}
  {% endblock %}
</body>

{% block js %}
    <script src="{% static 'node_modules/@popperjs/core/dist/umd/popper.min.js' %}"></script>
    <script src="{% static 'node_modules/bootstrap/dist/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'node_modules/moment/moment.js' %}"></script>
    <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'node_modules/@fortawesome/fontawesome-free/js/all.min.js' %}"></script>
    <script src="{% static 'fontawesomefree/js/all.min.js' %}"></script>
    <script src="{% static 'summernote/summernote-bs5.min.js' %}"></script>
    <script src="{% static 'vendor/util.js' %}"></script>
  <script>
  function showToast(message, type) {
    type = type || "info";
    const toastClasses = {
      success: "bg-success text-white",
      error: "bg-danger text-white",
      danger: "bg-danger text-white",
      info: "bg-primary text-white",
      warning: "bg-warning text-dark"
    };

    $(".toast-container .toast").remove();

    const toastHTML = `
      <div class="toast align-items-center ${toastClasses[type] || toastClasses.info} border-0 shadow"
           role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="8000">
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto"
                  data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>`;

    $(".toast-container").append(toastHTML);
    var toastEl = $(".toast-container .toast").last()[0];
    var toastInstance = new bootstrap.Toast(toastEl, { delay: 8000 });
    toastInstance.show();

    // Explicit close button handler (programmatic toasts need this wired manually)
    toastEl.querySelector('[data-bs-dismiss="toast"]').addEventListener("click", function () {
      toastInstance.hide();
    });

    // Dismiss on any link or button click outside the toast
    function dismissOnNav(e) {
      if (!toastEl.contains(e.target)) {
        toastInstance.hide();
      }
    }
    document.addEventListener("click", dismissOnNav);

    // Clean up the nav handler once toast is fully hidden
    toastEl.addEventListener("hidden.bs.toast", function () {
      document.removeEventListener("click", dismissOnNav);
    }, { once: true });
  }
  </script>

{% endblock %}
</html>
