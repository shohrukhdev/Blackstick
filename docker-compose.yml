
services:
  web:
    build: .
    command: gunicorn Blackstick.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./app/:/usr/src/dent/
    ports:
      - 8000:8000
    env_file:
      - ./.env
    networks:
      - internal
  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - 5432:5432
    restart: always
    networks:
      - internal
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=blackstick

  nginx:
    container_name: nginx
    image: nginx:alpine-slim
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/home/app/web/staticfiles
      - ./media:/home/app/web/mediafiles
      - ./ssl-certs:/etc/letsencrypt:ro  # Mount manually generated SSL certificates here
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: always
volumes:
  postgres_data:

networks:
  internal: