services:

  postgres:
    image: postgres:15-alpine
    container_name: blackstick_local_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=blackstick
    ports:
      - "5433:5432"   # 5433 on host so it doesn't clash with a local Postgres
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blackstick_local_redis
    ports:
      - "6379:6379"
    networks:
      - internal
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blackstick_local_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app                        # hot-reload: code changes reflected immediately
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host-specific values from .env for Docker networking
      - DOCKER_ENV=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_URL=redis://redis:6379/0
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: blackstick_local_celery
    command: celery -A Blackstick worker -l info
    volumes:
      - .:/app                        # same code mount so changes apply without rebuild
    env_file:
      - .env
    environment:
      - DOCKER_ENV=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=admin
      - DB_PASSWORD=admin
      - REDIS_URL=redis://redis:6379/0
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
