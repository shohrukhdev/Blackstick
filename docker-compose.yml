  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - 5432:5432
    restart: always
    networks:
      - internal
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=blackstick

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - internal
    volumes:
      - redis_data:/data

