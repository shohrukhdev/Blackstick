name: Build and Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/blackstick

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write docker-compose.prod.yml from secret
        env:
          COMPOSE_FILE_CONTENT: ${{ secrets.HETZNER_COMPOSE_FILE }}
        run: |
          if [ -z "$COMPOSE_FILE_CONTENT" ]; then
            echo "::error::HETZNER_COMPOSE_FILE secret is not set" >&2
            exit 1
          fi
          printf '%s\n' "$COMPOSE_FILE_CONTENT" > docker-compose.prod.yml

      - name: Copy compose and nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/conf.d/booket.conf"
          target: /opt/blackstick/

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: IMAGE,GH_TOKEN,GH_USER
          script: |
            set -e
            cd /opt/blackstick

            # Preflight: abort before touching the stack if disk space is dangerously low
            AVAIL_KB=$(df -Pk . | tail -1 | awk '{print $4}')
            if [ "$AVAIL_KB" -lt 1048576 ]; then
              echo "ERROR: less than 1GB free on /opt/blackstick — aborting deploy" >&2
              df -h .
              docker system df
              exit 1
            fi
            mkdir -p nginx/conf.d

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
            DOCKER_IMAGE="${IMAGE}:latest" docker compose -f docker-compose.prod.yml pull web

            DOCKER_IMAGE="${IMAGE}:latest" docker compose -f docker-compose.prod.yml up -d

            # Remove HTTP-only bootstrap config; HTTPS config (booket.conf) is now active
            rm -f nginx/conf.d/booket-init.conf

            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true

            # Keep only the 3 most recent images, remove the rest
            docker images "${IMAGE}" --format "{{.ID}}" | tail -n +4 | xargs -r docker rmi -f 2>/dev/null || true
            docker image prune -f

            echo "Deploy complete."
