name: Deployment

on:
  push:
    branches: [ main ]

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Build, tag and publish
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: django-ec2
          IMAGE_TAG: latest
        run: |
          docker buildx build --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG . --push

      - name: Pull and Run
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_REMOTE_URI: ${{ steps.login-ecr.outputs.registry }}/django-ec2
        run: |
          echo "${{ secrets.SSH_KEY }}" > dev.key
          chmod 600 dev.key
          echo BE_IMAGE="${{ env.IMAGE_REMOTE_URI }}:latest" >> .env
          echo DB_NAME="${{ secrets.DB_NAME }}" >> .env
          echo DB_USER="${{ secrets.DB_USER }}" >> .env
          echo DB_PASSWORD="${{ secrets.DB_PASSWORD }}" >> .env
          echo DB_HOST="${{ secrets.DB_HOST }}" >> .env
          echo DB_PORT="${{ secrets.DB_PORT }}" >> .env
          echo SECRET_KEY="${{ secrets.SECRET_KEY }}" >> .env
          echo FERNET_KEY="${{ secrets.FERNET_KEY }}" >> .env
          echo ESKIZ_EMAIL="${{ secrets.ESKIZ_EMAIL }}" >> .env
          echo ESKIZ_PASSWORD="${{ secrets.ESKIZ_PASSWORD }}" >> .env
          echo AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env
          echo AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env
          echo AWS_S3_ACCESS_KEY_ID="${{ secrets.AWS_S3_ACCESS_KEY_ID }}" >> .env
          echo AWS_S3_SECRET_ACCESS_KEY="${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}" >> .env
          echo AWS_S3_STORAGE_BUCKET_NAME="${{ secrets.AWS_S3_STORAGE_BUCKET_NAME }}" >> .env
          echo AWS_SES_USER_ACCESS_KEY_ID="${{ secrets.AWS_SES_USER_ACCESS_KEY_ID }}" >> .env
          echo AWS_SES_USER_SECRET_ACCESS_KEY="${{ secrets.AWS_SES_USER_SECRET_ACCESS_KEY }}" >> .env
      
          scp -i dev.key -o StrictHostKeyChecking=no docker-compose.prod.yml ubuntu@${{ secrets.INSTANCE_IP_ADDRESS }}:./
          scp -i dev.key -o StrictHostKeyChecking=no .env ubuntu@${{ secrets.INSTANCE_IP_ADDRESS }}:./
          ssh -i dev.key -o StrictHostKeyChecking=no ubuntu@${{ secrets.INSTANCE_IP_ADDRESS }} << "ENDSSH"
            ls
            aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
            aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            aws configure set region "eu-north-1"
            aws configure set output "text"
            aws ecr get-login-password --region eu-north-1 | docker login -u AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker pull ${{ env.IMAGE_REMOTE_URI }}:latest
            source .env
            echo "Come to START"
            docker-compose -f docker-compose.prod.yml up -d
            echo "Container STARTED"
          ENDSSH