name: Build and Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/blackstick

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose and nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/conf.d/booket.conf"
          target: /opt/blackstick/

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.IMAGE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: IMAGE,GH_TOKEN,GH_USER
          script: |
            set -e
            cd /opt/blackstick

            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
            DOCKER_IMAGE="${IMAGE}:latest" docker compose -f docker-compose.prod.yml pull web

            DOCKER_IMAGE="${IMAGE}:latest" docker compose -f docker-compose.prod.yml up -d --no-deps web

            # Remove old HTTP-only init config if still present (would conflict with booket.conf)
            rm -f nginx/conf.d/booket-init.conf

            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true

            # Keep only the 3 most recent images, remove the rest
            docker images "${IMAGE}" --format "{{.ID}}" | tail -n +4 | xargs -r docker rmi -f 2>/dev/null || true
            docker image prune -f

            echo "Deploy complete."
