# Temporary HTTP-only config used during the first SSL certificate issuance.
# After running certbot and getting the cert, remove this file and rename
# booket.conf.disabled → booket.conf, then reload nginx.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name booket.uz www.booket.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
