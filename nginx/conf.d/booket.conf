upstream django {
    server web:8000;
}

# Drop bot/scanner requests that arrive via IP address directly
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Redirect HTTP → HTTPS and handle certbot challenges
server {
    listen 80;
    server_name booket.uz www.booket.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name booket.uz www.booket.uz;

    ssl_certificate     /etc/letsencrypt/live/booket.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booket.uz/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /static/ {
        alias /home/app/web/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/app/web/mediafiles/;
        expires 7d;
    }

    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
