services:
  web:
    container_name: ubuntu_web_1
    env_file:
      - .env
    image: "${BE_IMAGE}"
    ports:
      - "8000:8000"
    command: gunicorn Blackstick.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles

  nginx:
    container_name: nginx
    image: nginx:alpine-slim
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/home/app/web/staticfiles
      - ./media:/home/app/web/mediafiles
      - ./ssl-certs:/etc/letsencrypt:ro  # Mount manually generated SSL certificates here
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: always

  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - ./ssl-certs:/etc/letsencrypt  # Mount the same SSL directory
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; certbot renew --webroot -w /var/www/certbot --quiet; exec tail -f /dev/null'"
    restart: always
volumes:
  static_volume:
  media_volume:
